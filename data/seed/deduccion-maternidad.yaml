faq:
  - question: ¿Puedo cobrar la deducción por maternidad si estoy en paro?
    answer: >-
      Sí, si en el momento del nacimiento cobrabas una prestación o subsidio por desempleo. Estar
      solo inscrita como demandante no es suficiente.
