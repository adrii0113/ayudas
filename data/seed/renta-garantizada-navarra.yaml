otherRequirements:
  - "El umbral exacto de ingresos lo fija la normativa autonómica según los miembros del hogar; como referencia orientativa usamos la renta garantizada del Ingreso Mínimo Vital."
  - "Es subsidiaria: antes hay que pedir las pensiones y prestaciones a las que tengas derecho, incluido el Ingreso Mínimo Vital."
  - "Implica acordar un itinerario o proyecto de inclusión con los servicios sociales."
  - "Si hay menores, personas dependientes o con discapacidad superior al 65 % en el hogar, basta con un año de residencia."
  - "Entre 18 y 24 años sin menores a cargo hay que acreditar dos años de vida independiente."
