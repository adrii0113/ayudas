otherRequirements:
  - "Matricularse y pagar por primera vez el primer curso de un grado o doble grado en una universidad pública de Castilla y León en 2026/2027."
  - "Estar empadronado en Castilla y León antes de que acabe el plazo de solicitud."
  - "Concurrencia competitiva: se ordena por la nota de acceso hasta agotar el presupuesto."
documents:
