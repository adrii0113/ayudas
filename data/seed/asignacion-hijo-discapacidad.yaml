slug: asignacion-hijo-discapacidad
version: 1
status: published
reviewedBy: "claude-code (requiere revisión humana)"
reviewedAt: "2026-10-14"
title: Asignación por hijo a cargo con discapacidad
summary: >-
  Prestación de la Seguridad Social por cada hijo con discapacidad del 33 % o más. Para hijos con
  discapacidad no hay límite de ingresos.
level: state
category: dependency
kind: permanent
agency: Seguridad Social (INSS)
amount:
  type: variable
  min: 1000
  text: >-
    1.000 € al año por cada hijo menor de 18 años con discapacidad del 33 % o más; 5.962,80 € al
    año por hijo mayor de edad con discapacidad del 65 % o más (8.942,40 € si es del 75 % y necesita
    ayuda de otra persona).
eligibility:
  all:
    - field: numChildrenWithDisability
      op: gte
      value: 1
      label: Tener un hijo con discapacidad reconocida del 33 % o más
      hard: true
otherRequirements:
  - "Residir legalmente en España."
  - "Si el hijo es mayor de 18 años, la discapacidad debe ser del 65 % o más."
  - "Las asignaciones por hijos con discapacidad no tienen límite de ingresos."
documents:
  - DNI o NIE
  - Libro de familia
  - Certificado de discapacidad del hijo
steps:
  - Solicítala en la sede electrónica de la Seguridad Social ("Prestaciones familiares").
officialUrl: https://www.seg-social.es/wps/portal/wss/internet/Trabajadores/PrestacionesPensionesTrabajadores/10967/27924
