    retrievedAt: "2026-10-14"
    excerpt: >-
      1.010 euros si se trata del primer hijo. 1.475 euros si se trata del segundo hijo. 2.351
      euros si se trata del tercer hijo o sucesivos.
faq:
  - question: ¿Es compatible con otras ayudas de la Junta por nacimiento?
    answer: >-
      La deducción no se aplica si has optado por pedir ayudas de la Junta de naturaleza análoga
      por el nacimiento o la adopción. Consulta si es el caso de la ayuda que hayas pedido.
