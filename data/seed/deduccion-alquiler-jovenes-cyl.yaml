title: Deducción autonómica por alquiler de vivienda para jóvenes (Castilla y León)
summary: >-
  Si tienes menos de 36 años y vives de alquiler en Castilla y León, puedes deducir el 20 % del
  alquiler (hasta 459 €) o el 25 % (hasta 612 €) en municipios pequeños.
