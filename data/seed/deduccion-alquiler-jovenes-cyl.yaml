otherRequirements:
  - "El límite de renta se refiere a la base imponible menos el mínimo personal y familiar de la declaración, no a los ingresos brutos."
  - "El 25 % se aplica en municipios de hasta 10.000 habitantes (o 3.000 si están a menos de 30 km de la capital de provincia)."
  - "Si recibes ayudas públicas al alquiler, la deducción no puede superar lo que pagas menos esas ayudas."
