title: Deducción autonómica por familia numerosa (Castilla y León)
summary: >-
  Las familias numerosas de Castilla y León deducen 600 € en el IRPF autonómico, y más con 4 o 5
  hijos o si algún miembro tiene una discapacidad del 65 % o más.
