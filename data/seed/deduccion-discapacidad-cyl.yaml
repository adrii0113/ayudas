title: Deducción autonómica para personas con discapacidad (Castilla y León)
summary: >-
  Deducción de 300 € (656 € en algunos casos) en el IRPF autonómico para contribuyentes con
  discapacidad y rentas moderadas.
level: regional
region: CL
category: dependency
kind: permanent
agency: Junta de Castilla y León / Agencia Tributaria
amount:
  type: range
  min: 300
  max: 656
  text: >-
    300 € con 65 años o más y discapacidad del 33 % o más (656 € si es del 65 % o más); 300 € para
    menores de 65 años con discapacidad del 65 % o más.
eligibility:
  all:
    - any:
        - field: applicantDisabilityPercent
          op: gte
          value: 65
          label: Discapacidad del 65 % o más
          source:
            url: https://sede.agenciatributaria.gob.es/Sede/ayuda/manuales-videos-folletos/manuales-practicos/irpf-2025-deducciones-autonomicas/comunidad-autonoma-castilla-leon/contribuyentes-discapacidad.html
            excerpt: >-
              300 euros por cada contribuyente menor de 65 años afectado por un grado de
              discapacidad igual o superior al 65 por 100
        - all:
            - field: applicantAge
              op: gte
              value: 65
              label: Tener 65 años o más
              source:
                url: https://sede.agenciatributaria.gob.es/Sede/ayuda/manuales-videos-folletos/manuales-practicos/irpf-2025-deducciones-autonomicas/comunidad-autonoma-castilla-leon/contribuyentes-discapacidad.html
                excerpt: >-
                  300 euros por cada contribuyente, de edad igual o superior a 65 años, afectado
                  por un grado de discapacidad igual o superior al 33 por 100
            - field: applicantDisabilityPercent
              op: gte
              value: 33
              label: Discapacidad del 33 % o más
              source:
                url: https://sede.agenciatributaria.gob.es/Sede/ayuda/manuales-videos-folletos/manuales-practicos/irpf-2025-deducciones-autonomicas/comunidad-autonoma-castilla-leon/contribuyentes-discapacidad.html
                excerpt: >-
                  300 euros por cada contribuyente, de edad igual o superior a 65 años, afectado
                  por un grado de discapacidad igual o superior al 33 por 100
      label: Tener una discapacidad del 65 % o más (o del 33 % si tienes 65 años o más)
      hard: true
    - field: annualHouseholdIncome
      op: lte
      value: 31500
      label: Renta de hasta 18.900 € en declaración individual (31.500 € en conjunta)
      source:
        url: https://sede.agenciatributaria.gob.es/Sede/ayuda/manuales-videos-folletos/manuales-practicos/irpf-2025-deducciones-autonomicas/comunidad-autonoma-castilla-leon/contribuyentes-discapacidad.html
        excerpt: 18.900 euros en tributación individual.
