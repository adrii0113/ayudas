title: "Deducción autonómica por alquiler de vivienda habitual (Extremadura)"
summary: >-
  Deducción del 30 % del alquiler de tu vivienda habitual, hasta 1.000 € al año (1.500 € en el
  medio rural), para menores de 36 años, familias numerosas o personas con discapacidad del 65 %
  o más.
