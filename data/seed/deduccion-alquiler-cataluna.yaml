title: "Deducción autonómica por alquiler de vivienda habitual (Cataluña)"
summary: >-
  Deducción del 10 % del alquiler de tu vivienda habitual (hasta 500 €, o 1.000 € en familias
  numerosas o monoparentales) si tienes 35 años o menos, has estado en paro, tienes discapacidad
  o formas parte de una familia numerosa o monoparental.
