slug: ayudas-permiso-conducir-jovenes-castilla-y-leon
version: 2
status: published
reviewedBy: "claude-code (requiere revisión humana)"
reviewedAt: "2026-10-14"
title: Ayudas para sacarse el carné de conducir (jóvenes de Castilla y León)
summary: >-
  Hasta 900 € para jóvenes de 18 a 30 años que obtengan el permiso B entre octubre y diciembre de
  2026 en una autoescuela de Castilla y León. El importe depende de la renta del hogar.
level: regional
region: CL
category: employment
kind: call
agency: Junta de Castilla y León (Consejería de Movilidad, Transformación Digital e IA)
amount:
  type: range
  min: 450
  max: 900
  text: >-
    Hasta 900 € si la renta del hogar es menor de 1,5 IPREM; 750 € entre 1,5 y 2,5; 600 € entre
    2,5 y 3,5; y 450 € a partir de 3,5 IPREM. Nunca más que el gasto real.
window:
  opensAt: "2026-10-01"
  closesAt: "2027-01-15"
eligibility:
  all:
    - field: applicantAge
      op: gte
      value: 18
      label: Tener 18 años o más
      source:
        url: https://bocyl.jcyl.es/boletines/2026/09/30/pdf/BOCYL-D-30092026-190-17.pdf
        excerpt: >-
          Tener una edad mínima de 18 años
    - field: applicantAge
      op: lte
      value: 30
      label: Cumplir como máximo 30 años en 2026
      source:
        excerpt: Tener una edad mínima de 18 años y, como máximo, cumplir 30 años dentro del presente año.
    - field: yearsRegisteredInRegion
      op: gte
      value: 5
      label: Llevar al menos 5 años empadronado en Castilla y León
      source:
        excerpt: >-
          Residir y estar empadronadas en cualquier municipio del territorio de la Comunidad de
          Castilla y León con al menos cinco años de antelación al momento de la obtención del
          permiso de conducción.
otherRequirements:
  - "Obtener el permiso B entre el 1 de octubre y el 31 de diciembre de 2026, con la formación hecha en autoescuelas de Castilla y León."
  - "Seguir empadronado en Castilla y León al menos 3 años tras la solicitud."
  - "Concurrencia competitiva: se conceden por orden de valoración hasta agotar el presupuesto (4 millones de euros)."
documents:
  - DNI o NIE
  - Facturas y justificantes de pago de la autoescuela y las tasas
  - Permiso de conducir obtenido
steps:
  - Saca el permiso B entre el 1 de octubre y el 31 de diciembre de 2026.
  - Presenta la solicitud en la sede electrónica de la Junta antes del 15 de enero de 2027 con las facturas pagadas.
officialUrl: https://www.tramitacastillayleon.jcyl.es/web/jcyl/AdministracionElectronica/es/Plantilla100Detalle/1251181050732/Ayuda012/1285684640457/Propuesta
sources:
  - url: https://bocyl.jcyl.es/boletines/2026/09/30/pdf/BOCYL-D-30092026-190-17.pdf
    retrievedAt: "2026-10-14"
    excerpt: >-
      La cuantía máxima de la subvención a conceder será de 900,00 euros [...] El plazo para la
      presentación de solitudes será desde el 1 de octubre de 2026 hasta el 15 de enero de 2027.
  - url: https://www.infosubvenciones.es/bdnstrans/GE/es/convocatorias/932041
    retrievedAt: "2026-10-14"
faq:
  - question: ¿Cuánto paga la Junta por el carné de conducir?
    answer: >-
      Hasta 900 €, según la renta del hogar, y nunca más de lo que hayas pagado en la autoescuela
      y tasas.
